# =============================================================================
# adapters/macos/pyproject.toml — `ascendo-macos` (Layer 5: Adapter)
# =============================================================================
#
# macOS adapter. Implements the interfaces defined in `ascendo.interfaces`
# (softwareupdate, mas, brew, App Store, Time Machine for read-only snapshots).
#
# Native logic lives in `scripts/<phase>.sh` and `lib/*.sh` (Bash 3.2+ — system
# shell) — Layer 6. The Python module (Layer 5) spawns Bash and parses JSON v1.
#
# Install in editable mode for development:
#   pip install -e adapters/macos/[dev]
#
# NOTE: macOS is **deferred to M5** (per HANDOFF.md). The package skeleton
# exists from M1.2 to allow CI matrix and import-linter rules to verify
# the architectural boundaries from day one.
# =============================================================================

[build-system]
requires      = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name            = "ascendo-macos"
version         = "0.0.1-dev"
description     = "Ascendo macOS adapter (softwareupdate, mas, brew, App Store, Time Machine)."
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.11"
authors         = [{ name = "KasprowiczM and Ascendo contributors" }]
classifiers     = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Software Distribution",
    "Typing :: Typed",
]

dependencies = [
    "ascendo>=0.0.1",
    "pydantic>=2.7,<3",
    # pyobjc-* added in M5 when actually implementing macOS-native calls.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4.4",
    "mypy>=1.10",
]

[project.urls]
Homepage   = "https://github.com/KasprowiczM/ascendo"
Repository = "https://github.com/KasprowiczM/ascendo"

[project.entry-points."ascendo.adapters"]
macos = "ascendo_macos:MacOSAdapter"

[tool.hatch.build.targets.wheel]
packages = ["ascendo_macos"]
include  = [
    "ascendo_macos/**/*.py",
    "scripts/**/*.sh",
    "lib/**/*.sh",
]

[tool.hatch.build.targets.sdist]
include = [
    "/ascendo_macos",
    "/scripts",
    "/lib",
    "/README.md",
    "/pyproject.toml",
    "/tests",
]
