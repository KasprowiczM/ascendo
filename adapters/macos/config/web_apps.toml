# ───────────────────────── Dev tools ─────────────────────────

[[app]]
slug = "vscode"
bundle_id = "com.microsoft.VSCode"  # verified on Mac.r12.home (2026-05-06)
display_name = "Visual Studio Code"
handler = "github_dmg"
github_repo = "microsoft/vscode"
asset_pattern = "VSCode-darwin-arm64\\.zip$"
enabled = false  # microsoft/vscode GH releases don't include arm64 zip assets at the documented URL pattern; VS Code uses its own update server and most users get it via brew cask 'visual-studio-code'. Real-Mac smoke at v0.3.0 confirmed the asset_pattern doesn't match. Re-enable + correct pattern via user override if needed.
notes = "Disabled: brew cask 'visual-studio-code' is the recommended path."

[[app]]
slug = "codeedit"
bundle_id = "app.codeedit.CodeEdit"  # verified on Mac.r12.home (2026-05-06)
display_name = "CodeEdit"
handler = "github_dmg"
github_repo = "CodeEditApp/CodeEdit"
asset_pattern = "CodeEdit-arm64\\.dmg$"
enabled = false  # CodeEditApp/CodeEdit GH releases don't expose arm64.dmg assets at the documented URL. Real-Mac smoke at v0.3.0 confirmed asset_pattern doesn't match. Re-enable via user override once correct pattern is identified.

[[app]]
slug = "rdm"
bundle_id = "com.devolutions.remotedesktopmanager"  # verified on Mac.r12.home (2026-05-06; was *.mac in template)
display_name = "Remote Desktop Manager"
handler = "github_dmg"
github_repo = "Devolutions/RemoteDesktopManagerMac"
asset_pattern = "RemoteDesktopManager.+arm64\\.dmg$"
enabled = false  # Devolutions distributes RDM via devolutions.net direct downloads, not GitHub. Real-Mac smoke at v0.3.0 confirmed the GH repo doesn't expose mac releases. Re-enable via user override once a sparkle/direct-URL handler exists.

# ───────────────────────── Productivity / Multimedia ─────────────────────────

[[app]]
