# ─── Proton Mail ────────────────────────────────────────────────────────────
[[app]]
slug = "proton-mail"
bundle_id = "ch.protonmail.desktop"
display_name = "Proton Mail"
handler = "release_feed"
notes = "Discovered via app.asar inspection (M5.7.3): inbox-desktop's update mechanism queries https://proton.me/download/mail/macos/version.json. Response is JSON with a Releases[] array, newest-first (mixed channels EarlyAccess + Stable). Releases[0].Version is the current latest (any channel). Live probe 2026-05-08: Releases[0].Version=1.13.0 (EarlyAccess) matches installed; Stable channel currently at 1.12.1. Caveat: array index 0 may shift between Stable and EarlyAccess depending on which is most recent — entry tracks 'latest available regardless of channel'. Vendor's own Squirrel updater handles the actual install on app launch."

[app.release_feed]
url = "https://proton.me/download/mail/macos/version.json"
version_path = "Releases[0].Version"
http_timeout_s = 8

