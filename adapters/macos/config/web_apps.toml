# adapters/macos/config/web_apps.toml
# Schema: ascendo-web-apps/v2 (M5.7+)
# Override registry — discovery layer (lib/web_discovery.sh) walks
# /Applications and emits the canonical inventory; this file is
# consulted to override per-bundle handler/config when the auto-
# fingerprint isn't right.
# User override at ~/.config/ascendo/web_apps.toml; user entries with
# matching `bundle_id` replace shipped entries; new bundle_ids append.
#
# Bundle IDs annotated with "verified on Mac.r12.home (2026-05-06)" were
# probed live via `defaults read /Applications/<App>.app/Contents/Info
# CFBundleIdentifier`. Entries marked "TODO: confirm bundle_id" were
# unavailable on Mac.r12.home and use vendor-documented IDs that should
# be re-verified during validate-macos.sh Stage 13 on a host with the
# app installed.

schema = "ascendo-web-apps/v2"

# ───────────────────────── Browsers ─────────────────────────

[[app]]
slug = "chrome"
bundle_id = "com.google.Chrome"  # verified on Mac.r12.home (2026-05-06)
display_name = "Google Chrome"
handler = "keystone"
ksadmin_product_id = "com.google.Chrome"
notes = "Keystone ticket reports productID=com.google.chrome (lowercase) on Mac.r12.home; ksadmin product IDs are case-insensitive on lookup but the canonical ticket form is mixed-case per Google's docs."

[[app]]
slug = "gdrive"
bundle_id = "com.google.drivefs"  # verified on Mac.r12.home (2026-05-06)
display_name = "Google Drive"
handler = "keystone"
ksadmin_product_id = "com.google.drivefs"
notes = "drivefs is migrating from legacy Keystone to GoogleUpdater; keystone handler still resolves the version through ksadmin --print. Confirm during validate-macos.sh Stage 13."

[[app]]
slug = "brave"
bundle_id = "com.brave.Browser"  # verified on Mac.r12.home (2026-05-06)
display_name = "Brave Browser"
handler = "keystone"
ksadmin_product_id = "com.brave.Browser"
notes = "Brave registers a Keystone product (own Omaha-based updater binary) AND publishes a Sparkle appcast. The Sparkle appcast uses Brave-internal versions (1.90.121.0) which don't match CFBundleShortVersionString (148.1.90.121) — comparing them gives nonsense. Keystone is the canonical update channel; ksadmin handles install. Tier-B (trigger-only) probe; apply fires the daemon. (Was: sparkle handler — switched in M5.7.1 after real-Mac smoke at v0.3.0 showed --check-for-update CLI flag returned non-zero.)"

[[app]]
slug = "opera"
bundle_id = "com.operasoftware.Opera"  # TODO: confirm bundle_id (not installed on Mac.r12.home)
display_name = "Opera"
handler = "sparkle"
appcast_url = "https://autoupdate.geo.opera.com/pub/opera/desktop/appcast.xml"

# firefox-dev / keepassxc / ledger-live moved to the M5.7.1 vendor-probe
# section below (release_feed for Mozilla product-details + Ledger CDN;
# github_dmg already-correct for keepassxc kept once at the new location).

[[app]]
slug = "trezor-suite"
bundle_id = "io.trezor.TrezorSuite"  # verified on Mac.r12.home (2026-05-06)
display_name = "Trezor Suite"
handler = "github_dmg"
github_repo = "trezor/trezor-suite"
asset_pattern = "Trezor-Suite-.+-mac-arm64\\.dmg$"

# ───────────────────────── AI desktop apps (Squirrel/auto-relaunch) ─────────────────────────

[[app]]
slug = "claude"
bundle_id = "com.anthropic.claudefordesktop"  # verified on Mac.r12.home (2026-05-06)
display_name = "Claude"
handler = "release_feed"
notes = "Discovered via app.asar reverse-engineering (M5.7.2): Squirrel.Mac fetches updates from api.anthropic.com/api/desktop/<platform>/<arch>/<installer>/update?device_id=<uuid>. The device_id is for server-side analytics — a fixed zero UUID returns the same currentRelease as a real client. Response is JSON; release_feed handler reads it. Live response 2026-05-08: currentRelease=1.6608.0."

[app.release_feed]
url = "https://api.anthropic.com/api/desktop/darwin/universal/squirrel/update?device_id=00000000-0000-0000-0000-000000000000"
version_path = "currentRelease"
http_timeout_s = 8

[[app]]
slug = "chatgpt"
bundle_id = "com.openai.chat"  # verified on Mac.r12.home (2026-05-06)
display_name = "ChatGPT"
handler = "squirrel"

[[app]]
slug = "chatgpt-atlas"
bundle_id = "com.openai.atlas"  # verified on Mac.r12.home (2026-05-06)
display_name = "ChatGPT Atlas"
handler = "sparkle"
appcast_url = "https://persistent.oaistatic.com/atlas/public/sparkle_public_appcast.xml"

[[app]]
slug = "warp"
bundle_id = "dev.warp.Warp-Stable"  # verified on Mac.r12.home (2026-05-06)
display_name = "Warp"
handler = "squirrel"

[[app]]
slug = "gemini"
bundle_id = "com.google.GeminiMacOS"  # verified on Mac.r12.home (2026-05-06; was com.google.Gemini in template)
display_name = "Gemini"
handler = "keystone"
ksadmin_product_id = "com.google.GeminiMacOS"
notes = "Keystone ticket on Mac.r12.home registered as productID=com.google.geminimacos with KSChannelID=m1-prod; the Squirrel template guess was wrong — Google Gemini uses Keystone."

[[app]]
slug = "lm-studio"
bundle_id = "ai.elementlabs.lmstudio"  # verified on Mac.r12.home (2026-05-06; was com.lmstudio.app in template)
display_name = "LM Studio"
handler = "squirrel"

[[app]]
slug = "perplexity"
bundle_id = "ai.perplexity.mac"  # verified on Mac.r12.home (2026-05-06; was ai.perplexity.app in template)
display_name = "Perplexity"
handler = "squirrel"

[[app]]
slug = "comet"
bundle_id = "ai.perplexity.comet"  # verified on Mac.r12.home (2026-05-06)
display_name = "Comet"
handler = "squirrel"

[[app]]
slug = "codex"
bundle_id = "com.openai.codex"  # verified on Mac.r12.home (2026-05-06)
display_name = "Codex Desktop"
handler = "sparkle"
appcast_url = "https://persistent.oaistatic.com/codex-app-prod/appcast.xml"
notes = "Discovered via app.asar reverse-engineering (M5.7.2): OpenAI's Codex desktop bundles BOTH Squirrel.framework and Sparkle.framework, but the active updater is Sparkle pointing at this public appcast. Response is RSS XML with sparkle:shortVersionString. Live response 2026-05-08: 26.506.21252."

# opencode moved to M5.7.1 vendor-probe section as github_dmg (disabled
# pending repo verification — sst/opencode vs anomalyco/opencode).

# ───────────────────────── Dev tools ─────────────────────────

# vscode moved to M5.7.1 vendor-probe section using release_feed against
# Microsoft's documented update API at update.code.visualstudio.com.

[[app]]
slug = "codeedit"
bundle_id = "app.codeedit.CodeEdit"  # verified on Mac.r12.home (2026-05-06)
display_name = "CodeEdit"
handler = "github_dmg"
github_repo = "CodeEditApp/CodeEdit"
asset_pattern = "CodeEdit-arm64\\.dmg$"
enabled = false  # CodeEditApp/CodeEdit GH releases don't expose arm64.dmg assets at the documented URL. Real-Mac smoke at v0.3.0 confirmed asset_pattern doesn't match. Re-enable via user override once correct pattern is identified.

[[app]]
slug = "rdm"
bundle_id = "com.devolutions.remotedesktopmanager"  # verified on Mac.r12.home (2026-05-06; was *.mac in template)
display_name = "Remote Desktop Manager"
handler = "builtin"
notes = "RDM publishes a Sparkle appcast at cdn.devolutions.net but stopped updating it (frozen at 2023.1.12.0). Modern releases (2024+) flow through their in-app updater that we can't probe externally. handler=builtin honestly skips the probe with manual-update instruction; without this override, discovery auto-classifies as sparkle and reports nonsense cand versions."

# ───────────────────────── Productivity / Multimedia ─────────────────────────

[[app]]
slug = "macwhisper"
bundle_id = "com.goodsnooze.MacWhisper"  # verified on Mac.r12.home (2026-05-06; was com.appsforartists.MacWhisper in template)
display_name = "MacWhisper"
handler = "github_dmg"
github_repo = "JordiBros/MacWhisper-releases"
asset_pattern = "MacWhisper-.+-arm64\\.dmg$"
enabled = false  # JordiBros/MacWhisper-releases is a GUESS — real distribution is goodsnooze.com direct downloads. Real-Mac smoke at v0.3.0 confirmed the repo doesn't exist or doesn't expose arm64 assets. Re-enable via user override once correct source identified.
notes = "vendor's distribution repo (placeholder; not confirmed)"

# ───────────────────────── Microsoft 365 + Docker ─────────────────────────

[[app]]
slug = "ms365"
bundle_id = "com.microsoft.autoupdate2"  # TODO: confirm bundle_id (Microsoft AutoUpdate not installed on Mac.r12.home)
display_name = "Microsoft 365 Suite"
handler = "msupdate"
notes = "covers Word/Excel/PowerPoint/Outlook/OneNote/Teams in one msupdate call"

[[app]]
slug = "docker"
bundle_id = "com.docker.docker"  # verified on Mac.r12.home (2026-05-06)
display_name = "Docker Desktop"
handler = "sparkle"
appcast_url = "https://desktop.docker.com/mac/main/arm64/appcast.xml"
notes = "Docker Desktop has a Sparkle appcast at desktop.docker.com that's the canonical update channel. The legacy 'docker' handler called 'docker desktop version' which returns the CLI plugin version (0.3.0), NOT the Docker.app version (4.71.0+). Switched to sparkle for accurate probing."

# ═════════════════════════════ M5.7.1 Vendor Probes ═════════════════════════
# Added 2026-05-08 after user-driven coverage push. Each entry has a
# verified URL + response-shape pair. Discovery's auto-classification
# would put these under squirrel/builtin (Tier-B trigger-only) — these
# overrides promote them to Tier-A (real candidate-version probe).
# ────────────────────────────────────────────────────────────────────────────

# ─── Microsoft VS Code ──────────────────────────────────────────────────────
[[app]]
slug = "vscode"
bundle_id = "com.microsoft.VSCode"
display_name = "Visual Studio Code"
handler = "release_feed"
notes = "Microsoft's documented update API. Returns JSON. download_path points to a ZIP not DMG; install path needs ZIP support OR fall back to user manual download. For now Tier-A probe only; apply triggers built-in updater via open -a."

[app.release_feed]
url = "https://update.code.visualstudio.com/api/update/darwin-arm64/stable/latest"
version_path = "productVersion"
http_timeout_s = 8

# ─── Zoom ──────────────────────────────────────────────────────────────────
[[app]]
slug = "zoom"
bundle_id = "us.zoom.xos"
display_name = "Zoom"
handler = "release_feed"
notes = "Zoom's public download API. Probe-only; Zoom's own auto-updater handles install on launch."

[app.release_feed]
url = "https://zoom.us/rest/download?os=mac"
version_path = "result.downloadVO.zoomArm64.version"
http_timeout_s = 8

# ─── Firefox Developer Edition ─────────────────────────────────────────────
[[app]]
slug = "firefox-dev"
bundle_id = "org.mozilla.firefoxdeveloperedition"
display_name = "Firefox Developer Edition"
handler = "release_feed"
notes = "Mozilla product-details. Probe-only (no DMG URL in this endpoint); apply opens app, Mozilla's own updater handles install on next launch. Overrides discovery's would-be 'builtin' classification (Firefox uses org.mozilla.updater, not Sparkle/Squirrel/Keystone)."

[app.release_feed]
url = "https://product-details.mozilla.org/1.0/firefox_versions.json"
version_path = "FIREFOX_DEVEDITION"
http_timeout_s = 8

# ─── Notion ────────────────────────────────────────────────────────────────
[[app]]
slug = "notion"
bundle_id = "notion.id"
display_name = "Notion"
handler = "release_feed"
notes = "Electron-builder latest-mac.yml. files[1] is the .dmg (files[0] is the .zip). download_path is relative; release_feed_apply resolves against the feed URL's parent dir."

[app.release_feed]
url = "https://desktop-release.notion-static.com/latest-mac.yml"
version_path = "version"
download_path = "files[1].url"
http_timeout_s = 8

# ─── Ledger Live ───────────────────────────────────────────────────────────
[[app]]
slug = "ledger-live"
bundle_id = "com.ledger.live"
display_name = "Ledger Live"
handler = "release_feed"
notes = "Electron-builder latest-mac.yml on Ledger's CDN. files[0] is .zip; the published mac DMG is at files[N] where N is implementation-dependent. Probe-only on apply (no download_path) since the DMG URL isn't always present in the YAML response — Ledger's own updater handles the swap on app relaunch."

[app.release_feed]
url = "https://download.live.ledger.com/latest-mac.yml"
version_path = "version"
http_timeout_s = 8

# ─── KeePassXC ─────────────────────────────────────────────────────────────
[[app]]
slug = "keepassxc"
bundle_id = "org.keepassxc.keepassxc"
display_name = "KeePassXC"
handler = "github_dmg"
github_repo = "keepassxreboot/keepassxc"
asset_pattern = "KeePassXC-.+-arm64\\.dmg$"
notes = "KeePassXC has no auto-update framework (in-app check just opens the GitHub page). github_dmg installs the .dmg directly."

# ─── Obsidian ──────────────────────────────────────────────────────────────
[[app]]
slug = "obsidian"
bundle_id = "md.obsidian"
display_name = "Obsidian"
handler = "github_dmg"
github_repo = "obsidianmd/obsidian-releases"
asset_pattern = "Obsidian-[0-9.]+\\.dmg$"
arch = "universal"
notes = "Obsidian publishes a universal-binary DMG (no arm64-specific build) on GH releases. Asset pattern matches Obsidian-1.12.7.dmg shape."

# ─── OpenCode ──────────────────────────────────────────────────────────────
[[app]]
slug = "opencode"
bundle_id = "ai.opencode.desktop"
display_name = "OpenCode"
handler = "github_dmg"
github_repo = "sst/opencode"
asset_pattern = "opencode-.+-arm64\\.dmg$"
enabled = false  # repo + asset pattern unverified; sst/opencode and anomalyco/opencode both publish under "opencode" name. Re-enable after verifying the canonical macOS DMG repo on user's machine.
notes = "Two candidate repos exist (sst/opencode, anomalyco/opencode); confirm which is the canonical macOS distribution before enabling."

# ─── Trezor Suite ──────────────────────────────────────────────────────────
# (Already shipped in M5.6 as github_dmg; no override needed.)

# ═════════════════════════════ M5.7.2 Vendor Probes ═════════════════════════
# Added 2026-05-08 via app.asar reverse-engineering (asar grep of binary
# strings + setFeedURL extraction). Three high-confidence URLs found:
# Claude (above, switched in-place), Codex (above, switched in-place),
# Notion Calendar (below, new entry), and Cursor (below, new entry —
# discovered ToDesktop's predictable URL pattern). All four verified
# live with `curl` returning the expected response shape.
# ────────────────────────────────────────────────────────────────────────────

# ─── Notion Calendar (formerly Cron) ───────────────────────────────────────
[[app]]
slug = "notion-calendar"
bundle_id = "com.cron.electron"
display_name = "Notion Calendar"
handler = "release_feed"
notes = "Electron-builder latest-mac.yml on Notion's CDN. Discovered via app.asar reverse-engineering (M5.7.2). Files list contains arm64 DMG + universal/x64 zips. files[2] is typically the arm64 DMG (after the two zips). Live response 2026-05-08: version 1.133.0."

[app.release_feed]
url = "https://calendar-desktop-release.notion-static.com/latest-mac.yml"
version_path = "version"
download_path = "files[2].url"
http_timeout_s = 8

# ─── Cursor (ToDesktop-distributed Electron app) ───────────────────────────
[[app]]
slug = "cursor"
bundle_id = "com.todesktop.230313mzl4w4u92"
display_name = "Cursor"
handler = "release_feed"
enabled = true  # tested live 2026-05-08; URL responds 200 even when app not installed locally
notes = "ToDesktop is the distribution platform; their app-id 230313mzl4w4u92 is Cursor's. URL pattern is ToDesktop's standard Electron-builder latest-mac.yml. Filenames have spaces ('Cursor 0.45.14 - Build ...-arm64-mac.zip'); release_feed_apply will URL-encode when resolving relative URLs. files[1] is typically arm64-mac.zip. Cursor not installed on this Mac at probe-time; entry verifies endpoint shape against the live ToDesktop CDN."

[app.release_feed]
url = "https://download.todesktop.com/230313mzl4w4u92/latest-mac.yml"
version_path = "version"
http_timeout_s = 8

# ─── Apps that still need mitmproxy on launch ──────────────────────────────
# ChatGPT (com.openai.chat) — Sparkle but SUFeedURL injected at runtime; not
#    in the app.asar. Capture appcast URL via mitmproxy.
# Warp (dev.warp.Warp-Stable) — custom Rust updater hitting GCS bucket;
#    binary strings showed releases.warp.dev as the host but no path scheme.
# MEGAsync (mega.mac) — proprietary Qt updater; no URL patterns found.
# LM Studio (ai.elementlabs.lmstudio) — private Cloudflare R2 bucket.
# Antigravity (com.google.antigravity) — endpoint requires per-build commit
#    hash; not probeable without exact value.
# Comet (ai.perplexity.comet) — Omaha4/Keystone protobuf; not JSON-probeable.
# All retain Tier-B trigger-only semantics until the operator captures their
# URL via mitmproxy on app launch and adds an override.
