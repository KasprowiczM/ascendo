[[app]]
slug = "docker"
bundle_id = "com.docker.docker"  # verified on Mac.r12.home (2026-05-06)
display_name = "Docker Desktop"
handler = "sparkle"
appcast_url = "https://desktop.docker.com/mac/main/arm64/appcast.xml"
notes = "Docker Desktop has a Sparkle appcast at desktop.docker.com that's the canonical update channel. The legacy 'docker' handler called 'docker desktop version' which returns the CLI plugin version (0.3.0), NOT the Docker.app version (4.71.0+). Switched to sparkle for accurate probing."

