# ─── Microsoft VS Code ──────────────────────────────────────────────────────
[[app]]
slug = "vscode"
bundle_id = "com.microsoft.VSCode"
display_name = "Visual Studio Code"
handler = "release_feed"
notes = "Microsoft's documented update API. Returns JSON. download_path points to a ZIP not DMG; install path needs ZIP support OR fall back to user manual download. For now Tier-A probe only; apply triggers built-in updater via open -a."

[app.release_feed]
url = "https://update.code.visualstudio.com/api/update/darwin-arm64/stable/latest"
version_path = "productVersion"
http_timeout_s = 8

