# ═════════════════════════════ M5.7.5 Phase B — last-mile static research ═══
# Added 2026-05-08. Closes out Tier-B apps that prior research rounds left
# as trigger-only, bringing each to either Tier-A (real candidate probe) or
# explicitly enabled=false with full evidence trail so future rounds don't
# re-investigate dead ends.
# ────────────────────────────────────────────────────────────────────────────

# ─── Inkscape ──────────────────────────────────────────────────────────────
[[app]]
slug = "inkscape"
bundle_id = "org.inkscape.Inkscape"
display_name = "Inkscape"
handler = "release_feed"
notes = "Promoted from builtin (Tier-B trigger-only) to release_feed Tier-A in M5.7.5 Phase B. Inkscape has no Sparkle / Keystone / Squirrel framework and no native auto-update path. Vendor's GitLab releases endpoint (gitlab.com/api/v4/projects/inkscape%2Finkscape/releases) returns INKSCAPE_X_Y_Z tag-name format requiring regex normalisation, but the simpler approach is to scrape the canonical download page at inkscape.org/release/ — its <title> tag reads 'Download Inkscape <version> | Inkscape' which the vendor updates atomically per release. Apply remains trigger-only — operator follows the inkscape.org link manually since no DMG-direct URL is published with the version in a stable shape (inkscape.org redirects vary by mirror). Live probe verified 2026-05-08: title regex extracted '1.4.4' (= installed CFBundleShortVersionString)."

[app.release_feed]
url = "https://inkscape.org/release/"
format = "text"
version_regex = "(?s).*<title>Download Inkscape ([0-9]+\\.[0-9]+(?:\\.[0-9]+)?) \\| Inkscape</title>.*"
version_replace = "\\1"
http_timeout_s = 8

# ─── Spotify ───────────────────────────────────────────────────────────────
[[app]]
slug = "spotify"
bundle_id = "com.spotify.client"
display_name = "Spotify"
handler = "release_feed"
notes = "Promoted from builtin (Tier-B trigger-only) to release_feed Tier-A in M5.7.5 Phase B. Spotify's own update endpoint at spclient.wg.spotify.com/desktop-update/v2/update requires a Bearer token (HTTP 401 without). Other guesses rejected: download.scdn.co/upgrade/client/osx/version (404), upgrade.scdn.co/upgrade/client/osx-arm64/Spotify-arm64.tbz (403), www.spotify.com/api/desktop/version/macos (302->404 SPA), download.scdn.co/SpotifyInstaller.pkg (404). Binary string mining only revealed the auth-gated spclient endpoint. However, Homebrew's autobump-tracked cask API at formulae.brew.sh/api/cask/spotify.json exposes the canonical version + DMG URL — same format as CFBundleShortVersionString (1.2.88.483 vs installed 1.2.87.415). Apply remains trigger-only (Spotify's in-app updater handles the install). Live probe verified 2026-05-08: version=1.2.88.483 (installed=1.2.87.415 -> outdated)."

[app.release_feed]
url = "https://formulae.brew.sh/api/cask/spotify.json"
version_path = "version"
http_timeout_s = 8

