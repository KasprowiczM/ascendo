# adapters/macos/config/web_apps.toml
# Schema: ascendo-web-apps/v2 (M5.7+)
# Override registry — discovery layer (lib/web_discovery.sh) walks
# /Applications and emits the canonical inventory; this file is
# consulted to override per-bundle handler/config when the auto-
# fingerprint isn't right.
# User override at ~/.config/ascendo/web_apps.toml; user entries with
# matching `bundle_id` replace shipped entries; new bundle_ids append.
#
# Bundle IDs annotated with "verified on Mac.r12.home (2026-05-06)" were
# probed live via `defaults read /Applications/<App>.app/Contents/Info
# CFBundleIdentifier`. Entries marked "TODO: confirm bundle_id" were
# unavailable on Mac.r12.home and use vendor-documented IDs that should
# be re-verified during validate-macos.sh Stage 13 on a host with the
# app installed.

schema = "ascendo-web-apps/v2"

# ───────────────────────── Browsers ─────────────────────────

[[app]]
slug = "chrome"
bundle_id = "com.google.Chrome"  # verified on Mac.r12.home (2026-05-06)
display_name = "Google Chrome"
handler = "keystone"
ksadmin_product_id = "com.google.Chrome"
notes = "macOS_updates channel: Google Keystone (GoogleSoftwareUpdateAgent --runMode ondemand / ksadmin --update). Not the Chrome Version History API — that feed can be ahead of Keystone rollout and made Ascendo plan a second path after sister already updated via Keystone."

[[app]]
slug = "gdrive"
bundle_id = "com.google.drivefs"  # verified on Mac.r12.home (2026-05-06)
display_name = "Google Drive"
handler = "keystone"
ksadmin_product_id = "com.google.drivefs"
notes = "macOS_updates channel: Google Keystone for Drive File Stream. Omaha probes were a second installer path."

[[app]]
slug = "brave"
bundle_id = "com.brave.Browser"  # verified on Mac.r12.home (2026-05-06)
display_name = "Brave Browser"
handler = "sparkle"
appcast_url = "https://updates.bravesoftware.com/sparkle/Brave-Browser/stable-arm64/appcast.xml"
notes = "Switched from release_feed-against-GitHub to native Sparkle in M5.7.6 (2026-05-24) after a real apply failed with handler exit 28 -- the `brave/brave-browser` GitHub releases/latest now only carries Android APK assets (no Brave-Browser-universal.dmg). The CANONICAL mac stable channel is the vendor's Sparkle appcast at updates.bravesoftware.com/sparkle/Brave-Browser/stable-arm64/appcast.xml -- it lags the GitHub tag by 0-1 patches because mac rollout is gated separately. Sparkle appcast version 1.90.124.0 matches CFBundleShortVersionString 148.1.90.124 (the Sparkle major drops the Chromium prefix; production sparkle_check compares both forms). DMG enclosure at updates-cdn.bravesoftware.com is direct-served (no auth, no GH rate limit). Reverted complexity: the M5.7.5 version_regex acrobatics for combining GitHub tag with Chromium milestone are no longer needed -- sparkle hands us the canonical channel version directly."

[[app]]
slug = "trezor-suite"
bundle_id = "io.trezor.TrezorSuite"  # verified on Mac.r12.home (2026-05-06)
display_name = "Trezor Suite"
handler = "github_dmg"
github_repo = "trezor/trezor-suite"
asset_pattern = "Trezor-Suite-.+-mac-arm64\\.dmg$"

# ───────────────────────── AI desktop apps (Squirrel/auto-relaunch) ─────────────────────────

[[app]]
slug = "claude"
bundle_id = "com.anthropic.claudefordesktop"  # verified on Mac.r12.home (2026-05-06)
display_name = "Claude"
handler = "squirrel"
notes = "macOS_updates channel: silent_launch (open -gjF). Not a second DMG/release_feed installer."

[[app]]
slug = "chatgpt"
bundle_id = "com.openai.chat"  # verified on Mac.r12.home (2026-05-06)
display_name = "ChatGPT"
handler = "squirrel"
notes = "macOS_updates channel: silent_launch (open -gjF) for ChatGPT Desktop."

[[app]]
slug = "warp"
bundle_id = "dev.warp.Warp-Stable"  # verified on Mac.r12.home (2026-05-06)
display_name = "Warp"
handler = "squirrel"
notes = "macOS_updates channel: silent_launch (open -gjF) for Warp."

[[app]]
slug = "megasync"
bundle_id = "mega.mac"  # TODO: verify bundle_id (not installed on Mac.r12.home)
display_name = "MEGAsync"
handler = "release_feed"
notes = "Promoted to Tier-A in M5.7.4 via version_regex. github.com/meganz/MEGAsync publishes per-platform tags `v6.3.0.1_OSX` / `_Linux` / `_Win`; the version (6.3.0.1) is shared across all three. The `releases/latest` endpoint may return any platform's tag depending on release order, but the regex strips the platform suffix uniformly. No DMG assets are attached to GitHub releases (vendor distributes via mega.nz/MEGAsyncSetupArm64.dmg without version metadata) so apply remains Tier-B (open the app, let the proprietary Qt updater take over). Live probe verified 2026-05-08 returned v6.3.0.1_Linux -> 6.3.0.1."

[app.release_feed]
url = "https://api.github.com/repos/meganz/MEGAsync/releases/latest"
version_path = "tag_name"
version_regex = "^v(.+)_(?:Linux|OSX|Win)$"
version_replace = "\\1"
http_timeout_s = 8

[[app]]
slug = "gemini"
bundle_id = "com.google.GeminiMacOS"  # verified on Mac.r12.home (2026-05-06; was com.google.Gemini in template)
display_name = "Gemini"
handler = "squirrel"
notes = "macOS_updates channel: silent_launch (open -gjF) for Gemini Desktop. Not Omaha/Keystone — sister never uses the Google agent for Gemini."

[[app]]
slug = "lm-studio"
bundle_id = "ai.elementlabs.lmstudio"  # verified on Mac.r12.home (2026-05-06; was com.lmstudio.app in template)
display_name = "LM Studio"
handler = "release_feed"
notes = "Promoted from squirrel (Tier-B trigger-only) to release_feed Tier-A in M5.7.5 Phase B. Vendor's own app-update.yml points at a private Cloudflare R2 bucket (174ee2ac3cc9a25a8bde971ff408f952.r2.cloudflarestorage.com/lmstudio-updaters/) requiring AWS S3 auth, and lmstudio.ai is fully JS-rendered with no public version endpoint. However, Homebrew's autobump-tracked cask API at formulae.brew.sh/api/cask/lm-studio.json exposes the canonical version + installer URL. Brew's version field uses comma-suffix `0.4.12,1` while CFBundleShortVersionString uses `0.4.12+1`; version_regex normalizes the comma to a plus. Apply remains trigger-only (LM Studio's in-app updater handles the install on launch). Live probe verified 2026-05-08: version=0.4.12,1 -> 0.4.12+1 (= installed)."

[app.release_feed]
url = "https://formulae.brew.sh/api/cask/lm-studio.json"
version_path = "version"
version_regex = "^([0-9]+\\.[0-9]+\\.[0-9]+),([0-9]+)$"
version_replace = "\\1+\\2"
http_timeout_s = 8

# Perplexity desktop: the OLD ai.perplexity.mac bundle was a Mac App
# Store app (filtered via _MASReceipt). The CURRENTLY shipped bundle is
# ai.perplexity.macv3 — NOT MAS (no receipt), Sparkle-framework present
# but the SUFeedURL is set programmatically at runtime (absent from
# Info.plist) so static discovery yields an empty candidate. Registered
# as `builtin` (Tier-B) so it is GUARANTEED to appear in the Phase-A
# Action-required list with a clear reason instead of being silently
# uncovered. This is the canonical Phase-C example: a user runs AI Tools
# → "Make Ascendo cover an app it's missing", the AI iteratively
# probe-tests a release_feed/sparkle entry and writes it to their
# ~/.config/ascendo/web_apps.toml. Selective+AI-maintained by design.
[[app]]
slug = "perplexity"
bundle_id = "ai.perplexity.macv3"
display_name = "Perplexity"
handler = "builtin"
notes = "macv3 bundle (not the retired MAS ai.perplexity.mac, not ai.perplexity.comet). Sparkle SUFeedURL is runtime-injected (absent from Info.plist), so static discovery yields no candidate. builtin keeps apply safe (safe-mode skip -> Action-required) with zero fake-silent-install risk. NOTE 2026-05-31: an unverified flip to handler=sparkle + appcast_url=macos-download.perplexity.ai/appcast.xml contradicted the comment block above and broke test_shipped_registry_has_perplexity_macv3_entry; reverted to builtin pending a probe-verified feed. Promote per-machine via the Phase-C AI-config loop once a working feed URL is captured."

[[app]]
slug = "comet"
bundle_id = "ai.perplexity.comet"  # verified on Mac.r12.home (2026-05-06)
display_name = "Comet"
handler = "squirrel"
notes = "macOS_updates channel: silent_launch (open -gjF) for Comet. Not a second Omaha installer."

[[app]]
slug = "codex"
bundle_id = "com.openai.codex"  # verified on Mac.r12.home (2026-05-06)
display_name = "Codex Desktop"
handler = "squirrel"
notes = "macOS_updates channel: silent_launch (open -gjF) for Codex Desktop."

