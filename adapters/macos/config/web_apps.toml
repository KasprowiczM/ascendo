# adapters/macos/config/web_apps.toml
# Schema: ascendo-web-apps/v2 (M5.7+)
# Override registry — discovery layer (lib/web_discovery.sh) walks
# /Applications and emits the canonical inventory; this file is
# consulted to override per-bundle handler/config when the auto-
# fingerprint isn't right.
# User override at ~/.config/ascendo/web_apps.toml; user entries with
# matching `bundle_id` replace shipped entries; new bundle_ids append.
#
# Bundle IDs annotated with "verified on Mac.r12.home (2026-05-06)" were
# probed live via `defaults read /Applications/<App>.app/Contents/Info
# CFBundleIdentifier`. Entries marked "TODO: confirm bundle_id" were
# unavailable on Mac.r12.home and use vendor-documented IDs that should
# be re-verified during validate-macos.sh Stage 13 on a host with the
# app installed.

schema = "ascendo-web-apps/v2"

# ───────────────────────── Browsers ─────────────────────────

[[app]]
slug = "chrome"
bundle_id = "com.google.Chrome"  # verified on Mac.r12.home (2026-05-06)
display_name = "Google Chrome"
handler = "release_feed"
notes = "Promoted from keystone (Tier-B trigger-only) to release_feed Tier-A in M5.7.4 Phase B. Google publishes the public Chrome Version History API at versionhistory.googleapis.com — JSON with `versions[0].version` matching CFBundleShortVersionString exactly. Apply remains trigger-only (no download_path) so the existing GoogleUpdater/Keystone daemon still drives the install on next launch. Live probe verified 2026-05-08: versions[0].version=148.0.7778.97 (= installed). Endpoint per https://developer.chrome.com/docs/web-platform/versionhistory/guide."

[app.release_feed]
url = "https://versionhistory.googleapis.com/v1/chrome/platforms/mac_arm64/channels/stable/versions"
version_path = "versions[0].version"
http_timeout_s = 8

[[app]]
slug = "gdrive"
bundle_id = "com.google.drivefs"  # verified on Mac.r12.home (2026-05-06)
display_name = "Google Drive"
handler = "omaha"
ksadmin_product_id = "com.google.drivefs"
notes = "Promoted from keystone (Tier-B trigger-only) to omaha (real-candidate probe) in M5.7.5 Phase A. Google's Omaha service at update.googleapis.com/service/update2 accepts POST + XML and returns the latest manifest version directly — version='0.0.0.0' in the request triggers a fresh-install-style response with manifest/@version=124.0.3.0 (live probe 2026-05-08). The M5.7.4 ruling (Stays Tier-B) was correct re: 'no public JSON proxy' but missed that Omaha XML IS publicly probeable for first-party Google products without authentication. Apply still delegates to keystone_apply via ksadmin_product_id (kept for Tier-B trigger semantics); Keystone daemon owns the actual install."

[app.omaha]
endpoint = "https://update.googleapis.com/service/update2"
appid = "com.google.drivefs"
http_timeout_s = 8

[[app]]
slug = "brave"
bundle_id = "com.brave.Browser"  # verified on Mac.r12.home (2026-05-06)
display_name = "Brave Browser"
handler = "release_feed"
notes = "Promoted from keystone (Tier-B) -> release_feed Tier-A check (M5.7.4 Phase B) -> full Tier-A apply (M5.7.5, 2026-05-09 after operator hit unlaunchable x86_64 Brave on arm64 Mac that Keystone couldn't reconcile). CFBundleShortVersionString is `<chromium_milestone>.<brave_internal>` (e.g. 148.1.90.121 = Chromium 148 + Brave 1.90.121). Neither the GitHub tag (v1.90.121) nor the Sparkle appcast (1.90.121.0) match directly, but the GitHub release `name` field carries both pieces — `Release v1.90.121 (Chromium 148.0.7778.96)`. The version_regex rewrites this into the canonical CFBundleShortVersionString shape. If Brave changes the release-name format the regex won't match and the handler falls back to the raw `name` value (degraded but visible) per M5.7.4 spec. Apply downloads `Brave-Browser-universal.dmg` (the only universal-binary asset; `Brave-Browser-arm64.dmg` is also published but `universal` is what brew/Sparkle use). The 234 MiB DMG needs a longer timeout than the 8s default because the GitHub API call returns a ~50 KiB JSON body but if curl follows the asset URL on a slow link it can take >8s — bump to 12s. Live probe verified 2026-05-08: name='Release v1.90.121 (Chromium 148.0.7778.96)' -> 148.1.90.121."

[app.release_feed]
url = "https://api.github.com/repos/brave/brave-browser/releases/latest"
version_path = "name"
version_regex = ".*v([0-9.]+) \\(Chromium ([0-9]+)\\.[^)]*\\).*"
version_replace = "\\2.\\1"
download_asset_pattern = "^Brave-Browser-universal\\.dmg$"
http_timeout_s = 12

[[app]]
slug = "opera"
bundle_id = "com.operasoftware.Opera"  # TODO: confirm bundle_id (not installed on Mac.r12.home)
display_name = "Opera"
handler = "sparkle"
appcast_url = "https://autoupdate.geo.opera.com/pub/opera/desktop/appcast.xml"

# firefox-dev / keepassxc / ledger-live moved to the M5.7.1 vendor-probe
# section below (release_feed for Mozilla product-details + Ledger CDN;
# github_dmg already-correct for keepassxc kept once at the new location).

[[app]]
slug = "trezor-suite"
bundle_id = "io.trezor.TrezorSuite"  # verified on Mac.r12.home (2026-05-06)
display_name = "Trezor Suite"
handler = "github_dmg"
github_repo = "trezor/trezor-suite"
asset_pattern = "Trezor-Suite-.+-mac-arm64\\.dmg$"

# ───────────────────────── AI desktop apps (Squirrel/auto-relaunch) ─────────────────────────

[[app]]
slug = "claude"
bundle_id = "com.anthropic.claudefordesktop"  # verified on Mac.r12.home (2026-05-06)
display_name = "Claude"
handler = "release_feed"
notes = "Discovered via app.asar reverse-engineering (M5.7.2): Squirrel.Mac fetches updates from api.anthropic.com/api/desktop/<platform>/<arch>/<installer>/update?device_id=<uuid>. The device_id is for server-side analytics — a fixed zero UUID returns the same currentRelease as a real client. Response is JSON; release_feed handler reads it. Live response 2026-05-08: currentRelease=1.6608.0."

[app.release_feed]
url = "https://api.anthropic.com/api/desktop/darwin/universal/squirrel/update?device_id=00000000-0000-0000-0000-000000000000"
version_path = "currentRelease"
http_timeout_s = 8

[[app]]
slug = "chatgpt"
bundle_id = "com.openai.chat"  # verified on Mac.r12.home (2026-05-06)
display_name = "ChatGPT"
handler = "sparkle"
appcast_url = "https://persistent.oaistatic.com/sidekick/public/sparkle_public_appcast.xml"
notes = "Discovered via binary mining (M5.7.3): ChatGPT.framework references the path fragment 'updates/sparkle/sidekick' which combines with the persistent.oaistatic.com host to give the public appcast at /sidekick/public/sparkle_public_appcast.xml. Probe verified live 2026-05-08; latest sparkle:shortVersionString=1.2026.118 (matches installed CFBundleShortVersionString)."

[[app]]
slug = "chatgpt-atlas"
bundle_id = "com.openai.atlas"  # verified on Mac.r12.home (2026-05-06)
display_name = "ChatGPT Atlas"
handler = "sparkle"
appcast_url = "https://persistent.oaistatic.com/atlas/public/sparkle_public_appcast.xml"

[[app]]
slug = "warp"
bundle_id = "dev.warp.Warp-Stable"  # verified on Mac.r12.home (2026-05-06)
display_name = "Warp"
handler = "release_feed"
notes = "Promoted from squirrel to release_feed in M5.7.4 once version_regex landed. Vendor publishes releases.warp.dev/channel_versions.json with `stable.version = \"v0.2026.05.06.15.42.stable_02\"`; CFBundleShortVersionString is `0.2026.05.06.15.42.02`. The leading `v` and `.stable_` infix are stripped by version_regex/version_replace. Live probe verified 2026-05-08 returned v0.2026.05.06.15.42.stable_02 -> 0.2026.05.06.15.42.02."

[app.release_feed]
url = "https://releases.warp.dev/channel_versions.json"
version_path = "stable.version"
version_regex = "^v(.+)\\.stable_(.+)$"
version_replace = "\\1.\\2"
http_timeout_s = 8

[[app]]
slug = "megasync"
bundle_id = "mega.mac"  # TODO: verify bundle_id (not installed on Mac.r12.home)
display_name = "MEGAsync"
handler = "release_feed"
notes = "Promoted to Tier-A in M5.7.4 via version_regex. github.com/meganz/MEGAsync publishes per-platform tags `v6.3.0.1_OSX` / `_Linux` / `_Win`; the version (6.3.0.1) is shared across all three. The `releases/latest` endpoint may return any platform's tag depending on release order, but the regex strips the platform suffix uniformly. No DMG assets are attached to GitHub releases (vendor distributes via mega.nz/MEGAsyncSetupArm64.dmg without version metadata) so apply remains Tier-B (open the app, let the proprietary Qt updater take over). Live probe verified 2026-05-08 returned v6.3.0.1_Linux -> 6.3.0.1."

[app.release_feed]
url = "https://api.github.com/repos/meganz/MEGAsync/releases/latest"
version_path = "tag_name"
version_regex = "^v(.+)_(?:Linux|OSX|Win)$"
version_replace = "\\1"
http_timeout_s = 8

[[app]]
slug = "gemini"
bundle_id = "com.google.GeminiMacOS"  # verified on Mac.r12.home (2026-05-06; was com.google.Gemini in template)
display_name = "Gemini"
handler = "omaha"
ksadmin_product_id = "com.google.geminimacos"
notes = "Promoted from keystone (Tier-B trigger-only) to omaha (real-candidate probe) in M5.7.5 Phase A. Google's Omaha service answers for com.google.geminimacos but ONLY when the request carries the channel tag from the Keystone ticket (`m1-prod` per ksadmin --print on Mac.r12.home; without it the response is 'noupdate' even for fresh installs because Gemini's distribution is gated by channel/cohort). Live probe 2026-05-08 with tag=m1-prod returned manifest/@version=1.53.0.262 (matches installed). Apply delegates to keystone_apply via ksadmin_product_id (lowercase per the actual ticket — was com.google.GeminiMacOS in the M5.7.3 template). The M5.7.4 'gemini.google.com/api/version is 404' line was correct; we just used the wrong endpoint."

[app.omaha]
endpoint = "https://update.googleapis.com/service/update2"
appid = "com.google.geminimacos"
tag = "m1-prod"
http_timeout_s = 8

[[app]]
slug = "lm-studio"
bundle_id = "ai.elementlabs.lmstudio"  # verified on Mac.r12.home (2026-05-06; was com.lmstudio.app in template)
display_name = "LM Studio"
handler = "release_feed"
notes = "Promoted from squirrel (Tier-B trigger-only) to release_feed Tier-A in M5.7.5 Phase B. Vendor's own app-update.yml points at a private Cloudflare R2 bucket (174ee2ac3cc9a25a8bde971ff408f952.r2.cloudflarestorage.com/lmstudio-updaters/) requiring AWS S3 auth, and lmstudio.ai is fully JS-rendered with no public version endpoint. However, Homebrew's autobump-tracked cask API at formulae.brew.sh/api/cask/lm-studio.json exposes the canonical version + installer URL. Brew's version field uses comma-suffix `0.4.12,1` while CFBundleShortVersionString uses `0.4.12+1`; version_regex normalizes the comma to a plus. Apply remains trigger-only (LM Studio's in-app updater handles the install on launch). Live probe verified 2026-05-08: version=0.4.12,1 -> 0.4.12+1 (= installed)."

[app.release_feed]
url = "https://formulae.brew.sh/api/cask/lm-studio.json"
version_path = "version"
version_regex = "^([0-9]+\\.[0-9]+\\.[0-9]+),([0-9]+)$"
version_replace = "\\1+\\2"
http_timeout_s = 8

# perplexity removed in M5.7.3: Perplexity Mac is a Mac App Store app
# (Contents/_MASReceipt present); discovery filters MAS apps via the
# receipt directory, so this web entry was dead. Updates flow through
# the `mas` adapter, not web.

[[app]]
slug = "comet"
bundle_id = "ai.perplexity.comet"  # verified on Mac.r12.home (2026-05-06)
display_name = "Comet"
handler = "omaha"
notes = "Promoted from squirrel (Tier-B trigger-only) to omaha (real-candidate probe) in M5.7.5 Phase A. Perplexity hosts their own Omaha-compatible service at perplexity.ai/rest/browser/update2 — but it speaks Omaha 4.0 (JSON, snake_case, returns updatecheck.nextversion instead of manifest.version), not 3.0. Discovered via strings on the bundled CometUpdater helper at Frameworks/Comet Framework.framework/.../Helpers/CometUpdater.app/Contents/MacOS/CometUpdater (literal 'https://www.perplexity.ai/rest/browser/update2'). Live probe 2026-05-08 returned updatecheck.nextversion=147.0.7727.1858 (matches installed). The M5.7.2 'protocol cannot be probed statically' note was wrong — the URL was discoverable from the binary; the missing piece was Omaha 4.0 protocol support (this milestone). Apply opens the app; CometUpdater (auto-launched via LaunchAgent ai.perplexity.CometUpdater.update) handles the install."

[app.omaha]
endpoint = "https://www.perplexity.ai/rest/browser/update2"
appid = "ai.perplexity.comet"
protocol = "4.0"
http_timeout_s = 8

[[app]]
slug = "codex"
bundle_id = "com.openai.codex"  # verified on Mac.r12.home (2026-05-06)
display_name = "Codex Desktop"
handler = "sparkle"
appcast_url = "https://persistent.oaistatic.com/codex-app-prod/appcast.xml"
notes = "Discovered via app.asar reverse-engineering (M5.7.2): OpenAI's Codex desktop bundles BOTH Squirrel.framework and Sparkle.framework, but the active updater is Sparkle pointing at this public appcast. Response is RSS XML with sparkle:shortVersionString. Live response 2026-05-08: 26.506.21252."

# opencode moved to M5.7.1 vendor-probe section as github_dmg (disabled
# pending repo verification — sst/opencode vs anomalyco/opencode).

# ───────────────────────── Dev tools ─────────────────────────

# vscode moved to M5.7.1 vendor-probe section using release_feed against
# Microsoft's documented update API at update.code.visualstudio.com.

[[app]]
slug = "codeedit"
bundle_id = "app.codeedit.CodeEdit"  # verified on Mac.r12.home (2026-05-06)
display_name = "CodeEdit"
handler = "github_dmg"
github_repo = "CodeEditApp/CodeEdit"
asset_pattern = "CodeEdit-arm64\\.dmg$"
enabled = false  # CodeEditApp/CodeEdit GH releases don't expose arm64.dmg assets at the documented URL. Real-Mac smoke at v0.3.0 confirmed asset_pattern doesn't match. Re-enable via user override once correct pattern is identified.

[[app]]
slug = "rdm"
bundle_id = "com.devolutions.remotedesktopmanager"  # verified on Mac.r12.home (2026-05-06)
display_name = "Remote Desktop Manager"
handler = "release_feed"
notes = "Promoted from builtin to Tier-A in M5.7.4 via the new format=text release_feed mode. Devolutions publishes a public productinfo.htm at devolutions.net that's plain key=value lines; the RDMMacbin.Version line gives the latest macOS RDM release directly. No JSON walking needed — version_regex matches the key=value line in the raw body. The Sparkle appcast at cdn.devolutions.net remains frozen at 2023.1.12.0; productinfo.htm is the canonical public version source. Live probe verified 2026-05-08: RDMMacbin.Version=2026.1.11.4 (= installed)."

[app.release_feed]
url = "https://devolutions.net/productinfo.htm"
format = "text"
version_regex = "(?s).*RDMMacbin\\.Version=([0-9][0-9.]*).*"
version_replace = "\\1"
http_timeout_s = 8

