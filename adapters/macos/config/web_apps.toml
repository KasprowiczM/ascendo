# adapters/macos/config/web_apps.toml
# Schema: ascendo-web-apps/v2 (M5.7+)
# Override registry — discovery layer (lib/web_discovery.sh) walks
# /Applications and emits the canonical inventory; this file is
# consulted to override per-bundle handler/config when the auto-
# fingerprint isn't right.
# User override at ~/.config/ascendo/web_apps.toml; user entries with
# matching `bundle_id` replace shipped entries; new bundle_ids append.
#
# Bundle IDs annotated with "verified on Mac.r12.home (2026-05-06)" were
# probed live via `defaults read /Applications/<App>.app/Contents/Info
# CFBundleIdentifier`. Entries marked "TODO: confirm bundle_id" were
# unavailable on Mac.r12.home and use vendor-documented IDs that should
# be re-verified during validate-macos.sh Stage 13 on a host with the
# app installed.

schema = "ascendo-web-apps/v2"

# ───────────────────────── Browsers ─────────────────────────

[[app]]
slug = "chrome"
bundle_id = "com.google.Chrome"  # verified on Mac.r12.home (2026-05-06)
display_name = "Google Chrome"
handler = "keystone"
ksadmin_product_id = "com.google.Chrome"
notes = "Keystone ticket reports productID=com.google.chrome (lowercase) on Mac.r12.home; ksadmin product IDs are case-insensitive on lookup but the canonical ticket form is mixed-case per Google's docs."

[[app]]
slug = "gdrive"
bundle_id = "com.google.drivefs"  # verified on Mac.r12.home (2026-05-06)
display_name = "Google Drive"
handler = "keystone"
ksadmin_product_id = "com.google.drivefs"
notes = "drivefs is migrating from legacy Keystone to GoogleUpdater; keystone handler still resolves the version through ksadmin --print. Confirm during validate-macos.sh Stage 13."

[[app]]
slug = "brave"
bundle_id = "com.brave.Browser"  # verified on Mac.r12.home (2026-05-06)
display_name = "Brave Browser"
handler = "keystone"
ksadmin_product_id = "com.brave.Browser"
notes = "Brave registers a Keystone product (own Omaha-based updater binary) AND publishes a Sparkle appcast. The Sparkle appcast uses Brave-internal versions (1.90.121.0) which don't match CFBundleShortVersionString (148.1.90.121) — comparing them gives nonsense. Keystone is the canonical update channel; ksadmin handles install. Tier-B (trigger-only) probe; apply fires the daemon. (Was: sparkle handler — switched in M5.7.1 after real-Mac smoke at v0.3.0 showed --check-for-update CLI flag returned non-zero.)"

[[app]]
slug = "opera"
bundle_id = "com.operasoftware.Opera"  # TODO: confirm bundle_id (not installed on Mac.r12.home)
display_name = "Opera"
handler = "sparkle"
appcast_url = "https://autoupdate.geo.opera.com/pub/opera/desktop/appcast.xml"

# firefox-dev / keepassxc / ledger-live moved to the M5.7.1 vendor-probe
# section below (release_feed for Mozilla product-details + Ledger CDN;
# github_dmg already-correct for keepassxc kept once at the new location).

[[app]]
slug = "trezor-suite"
bundle_id = "io.trezor.TrezorSuite"  # verified on Mac.r12.home (2026-05-06)
display_name = "Trezor Suite"
handler = "github_dmg"
github_repo = "trezor/trezor-suite"
asset_pattern = "Trezor-Suite-.+-mac-arm64\\.dmg$"

# ───────────────────────── AI desktop apps (Squirrel/auto-relaunch) ─────────────────────────

[[app]]
slug = "claude"
bundle_id = "com.anthropic.claudefordesktop"  # verified on Mac.r12.home (2026-05-06)
display_name = "Claude"
handler = "release_feed"
notes = "Discovered via app.asar reverse-engineering (M5.7.2): Squirrel.Mac fetches updates from api.anthropic.com/api/desktop/<platform>/<arch>/<installer>/update?device_id=<uuid>. The device_id is for server-side analytics — a fixed zero UUID returns the same currentRelease as a real client. Response is JSON; release_feed handler reads it. Live response 2026-05-08: currentRelease=1.6608.0."

[app.release_feed]
url = "https://api.anthropic.com/api/desktop/darwin/universal/squirrel/update?device_id=00000000-0000-0000-0000-000000000000"
version_path = "currentRelease"
http_timeout_s = 8

[[app]]
slug = "chatgpt"
bundle_id = "com.openai.chat"  # verified on Mac.r12.home (2026-05-06)
display_name = "ChatGPT"
handler = "sparkle"
appcast_url = "https://persistent.oaistatic.com/sidekick/public/sparkle_public_appcast.xml"
notes = "Discovered via binary mining (M5.7.3): ChatGPT.framework references the path fragment 'updates/sparkle/sidekick' which combines with the persistent.oaistatic.com host to give the public appcast at /sidekick/public/sparkle_public_appcast.xml. Probe verified live 2026-05-08; latest sparkle:shortVersionString=1.2026.118 (matches installed CFBundleShortVersionString)."

[[app]]
slug = "chatgpt-atlas"
bundle_id = "com.openai.atlas"  # verified on Mac.r12.home (2026-05-06)
display_name = "ChatGPT Atlas"
handler = "sparkle"
appcast_url = "https://persistent.oaistatic.com/atlas/public/sparkle_public_appcast.xml"

[[app]]
slug = "warp"
bundle_id = "dev.warp.Warp-Stable"  # verified on Mac.r12.home (2026-05-06)
display_name = "Warp"
handler = "squirrel"

[[app]]
slug = "gemini"
bundle_id = "com.google.GeminiMacOS"  # verified on Mac.r12.home (2026-05-06; was com.google.Gemini in template)
display_name = "Gemini"
handler = "keystone"
ksadmin_product_id = "com.google.GeminiMacOS"
notes = "Keystone ticket on Mac.r12.home registered as productID=com.google.geminimacos with KSChannelID=m1-prod; the Squirrel template guess was wrong — Google Gemini uses Keystone."

[[app]]
slug = "lm-studio"
bundle_id = "ai.elementlabs.lmstudio"  # verified on Mac.r12.home (2026-05-06; was com.lmstudio.app in template)
display_name = "LM Studio"
