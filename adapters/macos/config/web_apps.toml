# ─── Proton Mail ────────────────────────────────────────────────────────────
[[app]]
slug = "proton-mail"
bundle_id = "ch.protonmail.desktop"
display_name = "Proton Mail"
handler = "release_feed"
notes = "Discovered via app.asar inspection (M5.7.3): inbox-desktop's update mechanism queries https://proton.me/download/mail/macos/version.json. Response is JSON with a Releases[] array, newest-first (mixed channels EarlyAccess + Stable). Releases[0].Version is the current latest (any channel). Live probe 2026-05-08: Releases[0].Version=1.13.0 (EarlyAccess) matches installed; Stable channel currently at 1.12.1. Caveat: array index 0 may shift between Stable and EarlyAccess depending on which is most recent — entry tracks 'latest available regardless of channel'. Vendor's own Squirrel updater handles the actual install on app launch."

[app.release_feed]
url = "https://proton.me/download/mail/macos/version.json"
version_path = "Releases[0].Version"
http_timeout_s = 8

# ─── Apps that still need mitmproxy on launch ──────────────────────────────
# ChatGPT (com.openai.chat) — RESOLVED M5.7.3: Sparkle SUFeedURL is set
#    programmatically but the binary contains the path fragment
#    'updates/sparkle/sidekick'. The full appcast URL is at
#    persistent.oaistatic.com/sidekick/public/sparkle_public_appcast.xml.
#    Now Tier-A.
# Warp (dev.warp.Warp-Stable) — INVESTIGATED M5.7.3: public endpoint at
#    https://releases.warp.dev/channel_versions.json returns
#    `{"stable": {"version": "v0.2026.05.06.15.42.stable_02", ...}}`. Format
#    mismatches CFBundleShortVersionString '0.2026.05.06.15.42.02' (extra
#    'v' prefix, '.stable_' insertion). release_feed lacks regex/transform,
#    so probe would always report outdated false-positive. Stays Tier-B
#    until handler grows version_regex/version_transform support.
# OpenCode (ai.opencode.desktop) — RESOLVED M5.7.3: confirmed
#    `anomalyco/opencode` via app-update.yml; arm64 DMG asset
#    `opencode-desktop-mac-arm64.dmg` present on every release. Now Tier-A.
# Proton Mail (ch.protonmail.desktop) — RESOLVED M5.7.3: probe via
#    proton.me/download/mail/macos/version.json. Now Tier-A.
# MEGAsync (mega.mac) — INVESTIGATED M5.7.3: official update channel is the
#    proprietary Qt-based updater (no public URL in binary). GitHub releases
#    at github.com/meganz/MEGAsync use tags 'v6.3.0.1_OSX' (no DMG asset
#    attached, _OSX suffix). release_feed lacks regex extraction so the
#    suffix can't be stripped. Stays Tier-B until handler supports
#    version_regex.
# LM Studio (ai.elementlabs.lmstudio) — INVESTIGATED M5.7.3: app-update.yml
#    points at private Cloudflare R2 bucket
#    (174ee2ac3cc9a25a8bde971ff408f952.r2.cloudflarestorage.com/
#    lmstudio-updaters/) requiring AWS S3 auth. lmstudio.ai/download
#    is fully JS-rendered. No public version endpoint exists. Stays Tier-B.
# Antigravity (com.google.antigravity) — INVESTIGATED M5.7.3: API at
#    antigravity-auto-updater-974169037036.us-central1.run.app/api/update/
#    darwin-arm64/stable/<commit>/<host_hash> returns JSON with
#    productVersion field, but the field is stale (says '1.107.0' while
#    installed and homepage both say '1.23.2'). API is unreliable for
#    real-candidate probing. Stays Tier-B.
# Comet (ai.perplexity.comet) — INVESTIGATED M5.7.3: Chromium-fork using
#    Google's Omaha protocol over update.googleapis.com/service/update2/json
#    (POST + XML response). Not JSON-probeable without protocol support.
#    Stays Tier-B.
# Perplexity (ai.perplexity.mac) — INVESTIGATED M5.7.3: Mac App Store app
#    (verified _MASReceipt directory present). Discovery layer filters MAS
#    apps from web inventory; entry is dead but kept for historical record.
#    Updates are handled by App Store / mas adapter, not web.
# Brave (com.brave.Browser) — INVESTIGATED M5.7.3: triple version mismatch.
#    CFBundleShortVersionString=148.1.90.121 (Chromium-derived); GitHub tag
#    v1.90.121 (Brave's own scheme); Sparkle appcast 1.90.121.0 (internal).
#    None align directly. Stays as Keystone (existing entry; no improvement).
# Google Drive (com.google.drivefs) — INVESTIGATED M5.7.3: dl.google.com
#    serves the DMG without version metadata in headers. Google's update
#    mechanism is Omaha-based (same as Brave/Comet/Chrome). Stays as
#    Keystone (existing entry; no JSON-probeable alternative).
