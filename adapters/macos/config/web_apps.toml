# ───────────────────────── Microsoft 365 + Docker ─────────────────────────
# MAU per-app targeting (M5.7.4): each Office app gets its own [[app]]
# entry with its MAU Application ID under [app.msupdate]. check reads the
# installed version directly from `msupdate --config`; apply runs
# `msupdate --install --apps <ID>` so only the targeted product updates.
# Application IDs verified live against MAU 4.83 on Mac.r12.home (2026-05-08).

[[app]]
slug = "ms365"
bundle_id = "com.microsoft.autoupdate2"
display_name = "Microsoft AutoUpdate"
handler = "msupdate"
notes = "Microsoft AutoUpdate self-update entry. Without [app.msupdate.app_id] this entry triggers a global `msupdate --install` covering anything pending — useful as a catch-all (e.g. Office License OLIC02). Per-product entries below give Word/Excel/etc. their own real-candidate row."

[[app]]
slug = "ms-word"
bundle_id = "com.microsoft.Word"
display_name = "Microsoft Word"
handler = "msupdate"
notes = "MAU app id MSWD2019. msupdate --config returns the installed version directly; apply runs `msupdate --install --apps MSWD2019`."
[app.msupdate]
app_id = "MSWD2019"

[[app]]
slug = "ms-excel"
bundle_id = "com.microsoft.Excel"
display_name = "Microsoft Excel"
handler = "msupdate"
notes = "MAU app id XCEL2019."
[app.msupdate]
app_id = "XCEL2019"

[[app]]
slug = "ms-powerpoint"
bundle_id = "com.microsoft.Powerpoint"
display_name = "Microsoft PowerPoint"
handler = "msupdate"
notes = "MAU app id PPT32019."
[app.msupdate]
app_id = "PPT32019"

[[app]]
slug = "ms-outlook"
bundle_id = "com.microsoft.Outlook"
display_name = "Microsoft Outlook"
handler = "msupdate"
notes = "MAU app id OPIM2019."
[app.msupdate]
