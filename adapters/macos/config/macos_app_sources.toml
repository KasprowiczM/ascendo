# macOS cross-source deduplication configuration.
#
# When the same logical app is installed via multiple package managers
# (e.g. Brave via both brew cask and a web Sparkle feed), the
# orchestrator's deduplicator will prefer the source listed first in
# preferred_order and offer to auto-uninstall the non-preferred version.
#
# Schema: core/ascendo/models/deduplication.py — AppSourcesRegistry
#
# Synced 2026-08-25 from macOS_updates APPLICATIONS.md + internet_app_methods.txt.
# Homebrew casks take precedence over web handlers for apps that migrated
# to brew on 2026-08-05.

[[app]]
id = "claude"
name = "Claude"
preferred_order = ["web", "brew"]
[app.sources]
web = "com.anthropic.claudefordesktop"
brew = "claude"

[[app]]
id = "brave"
name = "Brave Browser"
preferred_order = ["brew", "web"]
[app.sources]
brew = "brave-browser"
web = "com.brave.Browser"

