<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;}
  .grid{display:grid;grid-template-columns:1fr 1fr;}
  .pane{padding:30px 24px;}
  .light{background:#EDEFF4;}
  .dark{background:#06080F;}
  .ttl{font:var(--fw-medium) 10px var(--font-mono);text-transform:uppercase;letter-spacing:.14em;margin:0 0 18px;}
  .light .ttl{color:#495078;}.dark .ttl{color:#A8ADC2;}
  .row{display:flex;gap:18px;align-items:center;justify-content:space-around;}
  .item{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .card{width:84px;height:56px;border-radius:8px;}
  .light .card{background:#FBFAF5;border:1px solid rgba(11,16,32,.08);}
  .dark .card{background:#131A2E;border:1px solid rgba(214,217,227,.06);}
  .lbl{font:var(--fw-medium) 10px var(--font-mono);}
  .light .lbl{color:#495078;}.dark .lbl{color:#A8ADC2;}
  .light .s1{box-shadow:0 1px 0 rgba(11,16,32,.04),0 1px 2px rgba(11,16,32,.04);}
  .light .s2{box-shadow:0 1px 0 rgba(11,16,32,.04),0 6px 14px rgba(11,16,32,.06);}
  .light .s3{box-shadow:0 10px 30px rgba(11,16,32,.10),0 2px 6px rgba(11,16,32,.04);}
  .light .s4{box-shadow:0 30px 60px rgba(11,16,32,.18),0 12px 24px rgba(11,16,32,.08);}
  .dark .s1{box-shadow:0 1px 0 rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.4);}
  .dark .s2{box-shadow:0 1px 0 rgba(0,0,0,.4),0 6px 14px rgba(0,0,0,.5);}
  .dark .s3{box-shadow:0 10px 30px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);}
  .dark .s4{box-shadow:0 30px 60px rgba(0,0,0,.7),0 12px 24px rgba(0,0,0,.5);}
</style></head>
<body>
<div class="grid">
  <div class="pane light">
    <p class="ttl">Light</p>
    <div class="row">
      <div class="item"><div class="card s1"></div><span class="lbl">sm · flush</span></div>
      <div class="item"><div class="card s2"></div><span class="lbl">md · cards</span></div>
      <div class="item"><div class="card s3"></div><span class="lbl">lg · popover</span></div>
      <div class="item"><div class="card s4"></div><span class="lbl">xl · modal</span></div>
    </div>
  </div>
  <div class="pane dark">
    <p class="ttl">Dark</p>
    <div class="row">
      <div class="item"><div class="card s1"></div><span class="lbl">sm · flush</span></div>
      <div class="item"><div class="card s2"></div><span class="lbl">md · cards</span></div>
      <div class="item"><div class="card s3"></div><span class="lbl">lg · popover</span></div>
      <div class="item"><div class="card s4"></div><span class="lbl">xl · modal</span></div>
    </div>
  </div>
</div>
</body></html>
