<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);}
  .grid{display:grid;grid-template-columns:1fr 1fr;}
  .pane{padding:24px 22px;display:flex;flex-direction:column;gap:14px;min-height:340px;}
  .pane.light{background:var(--paper-25);color:var(--ink-800);}
  .pane.dark{background:var(--ink-900);color:var(--paper-25);}
  .ttl{font:var(--fw-medium) 10px var(--font-mono);text-transform:uppercase;letter-spacing:.14em;opacity:.55;margin:0 0 -2px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  button{font:var(--fw-semibold) 13px var(--font-sans);padding:9px 14px;border-radius:6px;border:1px solid transparent;cursor:pointer;letter-spacing:-.005em;line-height:1;}
  .primary{background:#C8FF4B;color:#06080F;}
  .primary:hover{background:#D7FF7A;}
  .light .secondary{background:#0B1020;color:#F5F4EE;}
  .dark .secondary{background:#F5F4EE;color:#0B1020;}
  .light .ghost{background:transparent;color:#0B1020;border-color:rgba(11,16,32,.18);}
  .light .ghost:hover{background:rgba(11,16,32,.04);}
  .dark .ghost{background:transparent;color:#F5F4EE;border-color:rgba(245,244,238,.22);}
  .dark .ghost:hover{background:rgba(245,244,238,.06);}
  .danger{background:#DC4B43;color:#fff;}
  .sm{padding:6px 11px;font-size:11px;}
  .icon{display:inline-flex;align-items:center;gap:7px;}
  .icon svg{width:13px;height:13px;}
  .phase{font-family:var(--font-mono);font-weight:500;letter-spacing:.02em;text-transform:lowercase;}
  .light .phase.idle{background:#EDEFF4;color:#495078;}
  .dark .phase.idle{background:rgba(255,255,255,.08);color:#A8ADC2;}
  .phase.run{background:rgba(200,255,75,.2);color:#3a4a06;}
  .dark .phase.run{background:rgba(200,255,75,.16);color:#C8FF4B;}
</style></head>
<body>
<div class="grid">
  <div class="pane light">
    <p class="ttl">Light · paper</p>
    <div class="row">
      <button class="primary">Start run</button>
      <button class="secondary">Open dashboard</button>
      <button class="ghost">Cancel</button>
      <button class="danger">Stop</button>
    </div>
    <div class="row">
      <button class="primary icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/></svg>Run safe</button>
      <button class="ghost icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg>Re-run</button>
    </div>
    <p class="ttl">Small · phase pills</p>
    <div class="row">
      <button class="primary sm">+ Add target</button>
      <button class="phase sm idle">check</button>
      <button class="phase sm idle">plan</button>
      <button class="phase sm run">apply ●</button>
      <button class="phase sm idle">verify</button>
    </div>
  </div>
  <div class="pane dark">
    <p class="ttl">Dark · ink</p>
    <div class="row">
      <button class="primary">Start run</button>
      <button class="secondary">Open dashboard</button>
      <button class="ghost">Cancel</button>
      <button class="danger">Stop</button>
    </div>
    <div class="row">
      <button class="primary icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/></svg>Run safe</button>
      <button class="ghost icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg>Re-run</button>
    </div>
    <p class="ttl">Small · phase pills</p>
    <div class="row">
      <button class="primary sm">+ Add target</button>
      <button class="phase sm idle">check</button>
      <button class="phase sm idle">plan</button>
      <button class="phase sm run">apply ●</button>
      <button class="phase sm idle">verify</button>
    </div>
  </div>
</div>
</body></html>
