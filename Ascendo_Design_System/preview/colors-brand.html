<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-elev);}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .sw{display:flex;flex-direction:column;gap:6px;width:108px;}
  .chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border);}
  .name{font:var(--fw-medium) 11px/1.2 var(--font-mono);color:var(--fg);letter-spacing:.04em;}
  .hex{font:var(--fw-regular) 10px/1.2 var(--font-mono);color:var(--fg-faint);}
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#0B1020"></div><span class="name">Ink 800</span><span class="hex">#0B1020 · brand</span></div>
  <div class="sw"><div class="chip" style="background:#F5F4EE"></div><span class="name">Paper 25</span><span class="hex">#F5F4EE · surface</span></div>
  <div class="sw"><div class="chip" style="background:#C8FF4B"></div><span class="name">Lime 400</span><span class="hex">#C8FF4B · accent</span></div>
  <div class="sw"><div class="chip" style="background:#06080F"></div><span class="name">Ink 900</span><span class="hex">#06080F · code bg</span></div>
  <div class="sw"><div class="chip" style="background:#FBFAF5;border:1px solid #ddd"></div><span class="name">Paper 0</span><span class="hex">#FBFAF5 · elev</span></div>
  <div class="sw"><div class="chip" style="background:#FF6A3D"></div><span class="name">Blaze 500</span><span class="hex">#FF6A3D · rare</span></div>
</div>
</body></html>
