<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;}
  .grid{display:grid;grid-template-columns:1fr 1fr;}
  .pane{padding:26px 24px;display:flex;flex-direction:column;gap:14px;}
  .light{background:var(--paper-25);color:#0B1020;}
  .dark{background:var(--ink-900);color:#F5F4EE;}
  .row{display:flex;align-items:baseline;gap:18px;}
  .meta{font:var(--fw-medium) 10px var(--font-mono);text-transform:uppercase;letter-spacing:.12em;width:80px;flex:0 0 80px;opacity:.55;}
  .ttl{font:var(--fw-medium) 10px var(--font-mono);text-transform:uppercase;letter-spacing:.14em;margin:0 0 -2px;opacity:.55;}
</style></head>
<body>
<div class="grid">
  <div class="pane light">
    <p class="ttl">Light</p>
    <div class="row"><span class="meta">display</span><span class="t-display" style="font-size:56px">ascend.</span></div>
    <div class="row"><span class="meta">h1 / 56</span><span class="t-h1" style="font-size:42px">One tool. Three OSes.</span></div>
    <div class="row"><span class="meta">h2 / 32</span><span class="t-h2" style="font-size:28px">Every update, one place</span></div>
    <div class="row"><span class="meta">h3 / 24</span><span class="t-h3" style="font-size:22px">Run center</span></div>
    <div class="row"><span class="meta">h4 / 18</span><span class="t-h4" style="font-size:18px">Quick actions</span></div>
  </div>
  <div class="pane dark">
    <p class="ttl">Dark</p>
    <div class="row"><span class="meta">display</span><span class="t-display" style="font-size:56px">ascend.</span></div>
    <div class="row"><span class="meta">h1 / 56</span><span class="t-h1" style="font-size:42px">One tool. Three OSes.</span></div>
    <div class="row"><span class="meta">h2 / 32</span><span class="t-h2" style="font-size:28px">Every update, one place</span></div>
    <div class="row"><span class="meta">h3 / 24</span><span class="t-h3" style="font-size:22px">Run center</span></div>
    <div class="row"><span class="meta">h4 / 18</span><span class="t-h4" style="font-size:18px">Quick actions</span></div>
  </div>
</div>
</body></html>
