<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;}
  .grid{display:grid;grid-template-columns:1fr 1fr;}
  .pane{padding:24px 22px;display:flex;flex-direction:column;gap:12px;}
  .light{background:var(--paper-25);color:var(--ink-800);--in-bg:#E8E5DA;--in-bd:rgba(11,16,32,.18);--mut:#495078;--faint:#7A8099;}
  .dark{background:var(--ink-900);color:var(--paper-25);--in-bg:#131A2E;--in-bd:rgba(214,217,227,.18);--mut:#A8ADC2;--faint:#7A8099;}
  .ttl{font:var(--fw-medium) 10px var(--font-mono);text-transform:uppercase;letter-spacing:.14em;opacity:.55;margin:0 0 -2px;}
  label{font:var(--fw-medium) 10.5px var(--font-mono);color:var(--mut);text-transform:uppercase;letter-spacing:.1em;display:flex;flex-direction:column;gap:6px;}
  input,select{font:var(--fw-regular) 13.5px var(--font-sans);background:var(--in-bg);border:1px solid var(--in-bd);border-radius:6px;padding:8px 11px;color:inherit;outline:none;text-transform:none;letter-spacing:0;}
  input:focus,select:focus{border-color:#C8FF4B;box-shadow:0 0 0 3px rgba(200,255,75,.28);}
  .check{display:flex;align-items:center;gap:8px;font:var(--fw-regular) 12.5px var(--font-sans);color:inherit;text-transform:none;letter-spacing:0;}
  .row{display:flex;gap:10px;}.row > *{flex:1;}
</style></head>
<body>
<div class="grid">
  <div class="pane light">
    <p class="ttl">Light</p>
    <div class="row">
      <label>Profile<select><option>safe</option><option>quick</option><option>full</option></select></label>
      <label>Phase<select><option>(default)</option><option>check</option><option>plan</option><option>apply</option></select></label>
    </div>
    <label>Repo path<input value="~/Dev_Env/Ascendo" /></label>
    <label class="check"><input type="checkbox" checked style="width:auto;padding:0;accent-color:#C8FF4B;"/>Snapshot before each apply</label>
  </div>
  <div class="pane dark">
    <p class="ttl">Dark</p>
    <div class="row">
      <label>Profile<select><option>safe</option><option>quick</option><option>full</option></select></label>
      <label>Phase<select><option>(default)</option><option>check</option><option>plan</option><option>apply</option></select></label>
    </div>
    <label>Repo path<input value="~/Dev_Env/Ascendo" /></label>
    <label class="check"><input type="checkbox" checked style="width:auto;padding:0;accent-color:#C8FF4B;"/>Snapshot before each apply</label>
  </div>
</div>
</body></html>
