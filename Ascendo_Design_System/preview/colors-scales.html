<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-elev);}
  .row{display:flex;gap:6px;flex-wrap:nowrap;}
  .col{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
  .chip{height:46px;border-radius:6px;}
  .name{font:var(--fw-medium) 10px/1.2 var(--font-mono);color:var(--fg);}
  .hex{font:var(--fw-regular) 9px/1.2 var(--font-mono);color:var(--fg-faint);}
  h4{font:var(--fw-semibold) 11px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--fg-muted);margin:0 0 8px;}
  section{margin-bottom:14px;}
</style></head>
<body>
<section>
<h4>Ink scale</h4>
<div class="row">
  <div class="col"><div class="chip" style="background:#06080F"></div><span class="name">900</span></div>
  <div class="col"><div class="chip" style="background:#0B1020"></div><span class="name">800</span></div>
  <div class="col"><div class="chip" style="background:#131A2E"></div><span class="name">700</span></div>
  <div class="col"><div class="chip" style="background:#1C2440"></div><span class="name">600</span></div>
  <div class="col"><div class="chip" style="background:#2A3354"></div><span class="name">500</span></div>
  <div class="col"><div class="chip" style="background:#495078"></div><span class="name">400</span></div>
  <div class="col"><div class="chip" style="background:#7A8099"></div><span class="name">300</span></div>
  <div class="col"><div class="chip" style="background:#A8ADC2"></div><span class="name">200</span></div>
  <div class="col"><div class="chip" style="background:#D6D9E3"></div><span class="name">100</span></div>
  <div class="col"><div class="chip" style="background:#EDEFF4"></div><span class="name">50</span></div>
</div>
</section>
<section>
<h4>Lime scale (accent)</h4>
<div class="row">
  <div class="col"><div class="chip" style="background:#6B8C12"></div><span class="name">700</span></div>
  <div class="col"><div class="chip" style="background:#94B81F"></div><span class="name">600</span></div>
  <div class="col"><div class="chip" style="background:#B8E033"></div><span class="name">500</span></div>
  <div class="col"><div class="chip" style="background:#C8FF4B"></div><span class="name">400 ★</span></div>
  <div class="col"><div class="chip" style="background:#D7FF7A"></div><span class="name">300</span></div>
  <div class="col"><div class="chip" style="background:#E5FFA6"></div><span class="name">200</span></div>
  <div class="col"><div class="chip" style="background:#F0FFCD"></div><span class="name">100</span></div>
</div>
</section>
</body></html>
