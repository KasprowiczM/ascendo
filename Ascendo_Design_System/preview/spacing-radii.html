<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-elev);}
  .row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .b{width:90px;height:60px;background:#0B1020;border:1px solid rgba(11,16,32,.1);}
  .lbl{font:var(--fw-medium) 10px var(--font-mono);color:var(--fg-faint);}
</style></head>
<body>
<div class="row">
  <div class="item"><div class="b" style="border-radius:4px;background:#F5F4EE;border:1px solid #ddd"></div><span class="lbl">xs · 4px</span></div>
  <div class="item"><div class="b" style="border-radius:6px;background:#F5F4EE;border:1px solid #ddd"></div><span class="lbl">sm · 6 (controls)</span></div>
  <div class="item"><div class="b" style="border-radius:8px;background:#F5F4EE;border:1px solid #ddd"></div><span class="lbl">md · 8 (cards)</span></div>
  <div class="item"><div class="b" style="border-radius:12px;background:#F5F4EE;border:1px solid #ddd"></div><span class="lbl">lg · 12</span></div>
  <div class="item"><div class="b" style="border-radius:18px;background:#F5F4EE;border:1px solid #ddd"></div><span class="lbl">xl · 18 (mark)</span></div>
  <div class="item"><div class="b" style="border-radius:999px;background:#F5F4EE;border:1px solid #ddd;width:60px;"></div><span class="lbl">pill · badges</span></div>
</div>
</body></html>
