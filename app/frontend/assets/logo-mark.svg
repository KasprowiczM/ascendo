<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ascendo">
  <!-- Theme-independent mark: the lime rounded square reads clearly on
       BOTH the ink-dark and paper-light app surfaces, so the bars'
       surrounding is always visible. A 1px ink ring keeps the chip
       edge crisp even when a theme tint sits close to lime. -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#C8FF4B"
        stroke="#0B1020" stroke-width="2"></rect>
  <rect x="14" y="36" width="8" height="16" rx="2" fill="#0B1020"></rect>
  <rect x="28" y="26" width="8" height="26" rx="2" fill="#0B1020"></rect>
  <rect x="42" y="14" width="8" height="38" rx="2" fill="#0B1020"></rect>
</svg>
