ShortDescription: Unified updates for winget, Microsoft Store, Add/Remove Programs, and Windows Update.
Description: |-
  Ascendo is a cross-platform update orchestrator that wraps every package
  source on your machine — winget, Microsoft Store, Add/Remove Programs,
  Windows Update, drivers, and dev tools — behind one command, one
  dashboard, and one schedule.

  Run a read-only check in 15 seconds. Plan before applying. Apply with a
  typed confirmation gate and an automatic Volume Shadow Copy snapshot.
  Verify and clean up automatically. See every change as a structured JSON
  receipt in run history.

  Ships as a Tauri 2.x desktop window, a FastAPI dashboard at
  127.0.0.1:8765, or a python -m ascendo CLI — all backed by the same
  monorepo core. The same shell runs on Linux and macOS.

