InstallationNotes: |-
  After install, launch Ascendo from the Start menu (or run "ascendo"
  from any shell). The first-run wizard scans your installed apps, shows
  what's outdated, and walks you through a dry-run before any real
  upgrade. UAC will prompt for Administrator credentials when an apply
  phase needs them; the password is held only in dashboard process
  memory and never written to disk.
