<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ascendo - Unified Updates</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0e0f12;
        color: #e4e6eb;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
      }
      .splash {
        text-align: center;
      }
      .splash h1 {
        margin: 0 0 0.4rem;
        font-size: 1.6rem;
        font-weight: 600;
        background: linear-gradient(135deg, #22c55e, #0ea5e9);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .splash p {
        margin: 0;
        color: #9aa0a6;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <h1>Ascendo</h1>
      <p>Starting unified updates dashboard&hellip;</p>
    </div>
    <script src="main.js"></script>
  </body>
</html>
