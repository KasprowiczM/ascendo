[package]
name = "ascendo-desktop"
version = "0.0.1-dev"
description = "Ascendo - Unified Updates desktop shell"
authors = ["Ascendo"]
license = "MIT"
edition = "2021"
rust-version = "1.78"

# See https://doc.rust-lang.org/cargo/reference/manifest.html
#
# Note: Tauri 2.x's `npm create tauri-app` template includes a [lib]
# section pointing at src/lib.rs to support mobile (iOS/Android). We
# don't ship mobile, so we keep just the binary at src/main.rs and omit
# the lib target. If you ever add `tauri android init` / `tauri ios
# init`, restore [lib] + create src/lib.rs that exports a `run()` fn
# called from main.rs.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[features]
# This feature is used for production builds where `devPath` points to the
# filesystem and the bundle is fully bundled. When unset, dev tooling can
# still reach the dev server.
custom-protocol = ["tauri/custom-protocol"]
